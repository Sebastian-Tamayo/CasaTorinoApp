<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Menú del día · Casa Torino</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Lilita+One&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 1080px;
      height: 1920px;
      background: #fff8e8;
      overflow: hidden;
    }
    .canvas {
      width: 1080px;
      height: 1920px;
      background: #fff8e8;
      padding: 36px;
    }
    .frame {
      width: 100%;
      height: 100%;
      background: linear-gradient(160deg, #6b4228 0%, #3d2416 45%, #5a3420 100%);
      border-radius: 18px;
      padding: 28px;
      box-shadow: 0 18px 40px rgba(40, 20, 8, 0.28);
    }
    .board {
      width: 100%;
      height: 100%;
      background:
        radial-gradient(1200px 800px at 50% 18%, rgba(255,255,255,.05), transparent 55%),
        #161410;
      border-radius: 8px;
      box-shadow: inset 0 0 0 10px #2a1c14, inset 0 0 80px rgba(0,0,0,.45);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 42px 64px 36px;
      color: #f7f3ea;
    }
    .logo-wrap {
      width: 430px;
      height: 430px;
      border-radius: 50%;
      overflow: hidden;
      background: #fff8e8;
      flex: 0 0 auto;
      box-shadow: 0 10px 28px rgba(0,0,0,.35);
    }
    .logo-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    h1 {
      margin: 28px 0 8px;
      font-family: "Lilita One", "Caveat", Georgia, serif;
      font-weight: 400;
      font-size: 132px;
      line-height: .9;
      color: #f6d34d;
      letter-spacing: .01em;
      text-shadow: 0 3px 0 rgba(0,0,0,.25);
    }
    h1 span { font-size: .72em; }
    h2 {
      margin: 18px 0 0;
      font-family: "Lilita One", Georgia, serif;
      font-weight: 400;
      font-size: 72px;
      color: #f6d34d;
      letter-spacing: .02em;
      border-bottom: 6px solid #f6d34d;
      line-height: 1.05;
      padding: 0 8px 2px;
    }
    .plato {
      margin: 14px 0 8px;
      max-width: 860px;
      font-family: "Caveat", "Segoe Print", cursive;
      font-size: 78px;
      font-weight: 700;
      line-height: 1.02;
      color: #f4f1ea;
      white-space: pre-wrap;
    }
    .extra {
      margin-top: 28px;
      font-family: "Caveat", cursive;
      font-size: 64px;
      font-weight: 700;
      color: #f7f4ee;
    }
    .precio {
      margin: 18px 0 0;
      font-family: "Lilita One", Georgia, serif;
      font-size: 108px;
      line-height: 1;
      color: #f6d34d;
    }
    .dir {
      margin-top: auto;
      padding-top: 18px;
      font-family: "Lilita One", Georgia, serif;
      font-size: 42px;
      letter-spacing: .04em;
      color: #f6d34d;
    }
  </style>
</head>
<body>
  <div class="canvas">
    <div class="frame">
      <div class="board">
        <div class="logo-wrap">
          <img src="casa-torino-logo.jpg" alt="Casa Torino" />
        </div>
        <h1><span>✦</span> Menú <span>✦</span></h1>
        <h2>Primeros</h2>
        <p class="plato" id="primero">Sopa de pasta</p>
        <h2>Segundos</h2>
        <p class="plato" id="segundo">Tacos de cerdo a la jardinera con patatas</p>
        <p class="extra" id="extra">✦ Postre y bebida a elegir ✦</p>
        <p class="precio" id="precio">Precio 13€</p>
        <p class="dir" id="direccion">Ctra. Ceares 67</p>
      </div>
    </div>
  </div>
</body>
</html>
