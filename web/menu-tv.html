<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <!-- Android TV: scale fijo; sin zoom del navegador que deja el cartel a trozos -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Menú del día · TV · Casa Torino</title>
  <meta name="robots" content="noindex,nofollow" />
  <meta name="theme-color" content="#0c1018" />
  <meta name="description" content="Pantalla TV Xiaomi/Android: cartel del menú encajado entero." />
  <link rel="icon" type="image/jpeg" href="assets/logo.jpg" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      background: #0c1018;
      color: #fff8e8;
      font-family: Montserrat, system-ui, sans-serif;
      overflow: hidden !important;
      touch-action: none;
    }
    #tvRoot {
      position: fixed;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0c1018;
    }
    #tvStage {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0c1018;
    }
    /* Tamaño lo pone JS en px (object-fit falla en Android TV) */
    #tvImg {
      position: absolute;
      display: block;
      border: 0;
      background: #111;
      /* sin width/height CSS: los pone fitCartel() */
    }
    #tvImg[hidden] { display: none !important; }
    #tvEmpty {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      max-width: 80%;
      text-align: center;
      color: rgba(255,248,232,.7);
      font-weight: 700;
      font-size: 22px;
      line-height: 1.4;
    }
    #tvEmpty[hidden] { display: none !important; }
    #tvBar {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 14px;
      background: linear-gradient(0deg, rgba(0,0,0,.85), transparent);
      font-size: 14px;
      font-weight: 600;
      color: rgba(255,248,232,.75);
    }
    #tvBar button {
      border: 1px solid rgba(241,196,15,.45);
      background: rgba(12,16,24,.9);
      color: #f1c40f;
      border-radius: 999px;
      padding: 10px 16px;
      font: inherit;
      font-weight: 800;
      font-size: 15px;
      cursor: pointer;
      min-height: 44px;
    }
    #tvPrice {
      color: #f1c40f;
      font-weight: 800;
      margin-left: 8px;
    }
  </style>
</head>
<body>
  <div id="tvRoot">
    <div id="tvStage">
      <img id="tvImg" alt="Menú del día" hidden />
      <p id="tvEmpty">Cargando menú del día…</p>
    </div>
    <div id="tvBar">
      <span>
        <span id="tvStatus">Encajando cartel…</span>
        <span id="tvPrice"></span>
      </span>
      <span style="display:flex;gap:8px;flex-wrap:wrap">
        <button type="button" id="tvFit" aria-label="Encajar cartel">Encajar</button>
        <button type="button" id="tvFullscreen" aria-label="Pantalla completa">Pantalla completa</button>
      </span>
    </div>
  </div>

  <script src="carta.js"></script>
  <script>
    (() => {
      const FALLBACK = 'assets/menu-diario.jpg'
      const ORDER = [
        'menu-dia-unificado-semana',
        'menu-dia-co-finde',
        'menu-dia-es-finde',
        'menu-dia-sabado',
        'menu-dia-domingo',
      ]
      const $ = (id) => document.getElementById(id)
      const money = (n) =>
        Number(n).toLocaleString('es-ES', {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2,
        }) + '\u00a0€'

      /** Viewport real (Android TV a menudo miente con vh/dvh). */
      function viewportSize() {
        const w = Math.max(
          320,
          Number(window.innerWidth) || 0,
          Number(document.documentElement && document.documentElement.clientWidth) || 0,
          Number(screen && screen.width) || 0,
        )
        const h = Math.max(
          240,
          Number(window.innerHeight) || 0,
          Number(document.documentElement && document.documentElement.clientHeight) || 0,
          Number(screen && screen.height) || 0,
        )
        return { w, h }
      }

      /**
       * Escala el cartel a píxeles exactos para que quepa ENTERO.
       * No usa object-fit (roto / ignorado en WebView Xiaomi TV).
       */
      function fitCartel() {
        const img = $('tvImg')
        if (!img || img.hidden) return
        const nw = Number(img.naturalWidth) || 0
        const nh = Number(img.naturalHeight) || 0
        if (nw < 2 || nh < 2) return

        const { w: vw, h: vh } = viewportSize()
        // Dejar un poco de margen; la barra inferior ~56px
        const padX = 8
        const padY = 8
        const bar = 56
        const availW = Math.max(100, vw - padX * 2)
        const availH = Math.max(100, vh - padY * 2 - bar)

        const scale = Math.min(availW / nw, availH / nh)
        const tw = Math.max(1, Math.floor(nw * scale))
        const th = Math.max(1, Math.floor(nh * scale))
        const left = Math.floor((vw - tw) / 2)
        const top = Math.floor((vh - bar - th) / 2 + padY / 2)

        img.style.position = 'absolute'
        img.style.width = tw + 'px'
        img.style.height = th + 'px'
        img.style.maxWidth = 'none'
        img.style.maxHeight = 'none'
        img.style.left = left + 'px'
        img.style.top = Math.max(0, top) + 'px'
        img.style.right = 'auto'
        img.style.bottom = 'auto'
        img.style.margin = '0'
        img.style.transform = 'none'
        img.style.objectFit = 'fill'

        const st = $('tvStatus')
        if (st) {
          st.textContent =
            'Cartel completo · ' + tw + '×' + th + ' · pantalla ' + vw + '×' + vh
        }
      }

      async function loadCarta() {
        try {
          const r = await fetch('/api/carta', {
            cache: 'no-store',
            headers: { Accept: 'application/json' },
          })
          if (r.ok) return r.json()
        } catch (err) {
          console.warn('[menu-tv] api', err)
        }
        try {
          const r2 = await fetch('data/carta.json', { cache: 'no-store' })
          if (r2.ok) return r2.json()
        } catch (err) {
          console.warn('[menu-tv] json', err)
        }
        return null
      }

      function pickMenu(data) {
        const kindInfo =
          window.CasaTorinoCarta?.menuDayKind?.(data) || {
            schedule: 'weekday',
            kind: 'weekday',
          }
        const schedule = kindInfo.schedule || 'weekday'
        const md = data?.menuDay || {}
        const sat = md.saturday || {}
        const sun = md.sunday || {}
        const week = md.weekday || {}
        const satP = Number.isFinite(Number(sat.price)) ? Number(sat.price) : 16
        const sunP = Number.isFinite(Number(sun.price)) ? Number(sun.price) : 18
        const weekP = Number.isFinite(Number(week.price ?? week.unified))
          ? Number(week.price ?? week.unified)
          : 13
        const price =
          schedule === 'saturday' ? satP : schedule === 'sunday' ? sunP : weekP

        const menus = (data?.categories || []).find((c) => c && c.id === 'menus-dia')
        const itemSchedule = (it) =>
          window.CasaTorinoCarta?.menuItemSchedule?.(it) || ''
        let items = (menus?.items || []).filter(
          (it) =>
            it &&
            it.image_url &&
            !it.customProduct &&
            itemSchedule(it) === schedule,
        )
        items = [...items].sort((a, b) => {
          const ia = ORDER.indexOf(a.id)
          const ib = ORDER.indexOf(b.id)
          return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib)
        })
        const item = items[0] || null
        return {
          schedule,
          price,
          image: item?.image_url || FALLBACK,
          name: item?.name || 'Menú del día',
          fromApi: Boolean(item?.image_url),
        }
      }

      function show(pick) {
        const img = $('tvImg')
        const empty = $('tvEmpty')
        const priceEl = $('tvPrice')
        if (priceEl) priceEl.textContent = money(pick.price)
        if (!img) return
        const next = String(pick.image || FALLBACK)

        const onReady = () => {
          img.hidden = false
          if (empty) empty.hidden = true
          // Varios pases: Android TV a veces reporta 0×0 al primer frame
          fitCartel()
          requestAnimationFrame(fitCartel)
          setTimeout(fitCartel, 50)
          setTimeout(fitCartel, 250)
          setTimeout(fitCartel, 800)
        }

        img.onload = onReady
        img.onerror = () => {
          if (next.indexOf(FALLBACK) === -1) {
            img.src = FALLBACK + '?v=tv2'
            return
          }
          img.hidden = true
          if (empty) {
            empty.hidden = false
            empty.textContent =
              'No hay foto del menú. Súbela en Editar carta (TPV).'
          }
        }
        img.alt = pick.name
        // cache-bust suave si es el mismo asset
        const bust =
          next.indexOf('?') >= 0 ? next + '&tv=2' : next + (next.indexOf('http') === 0 ? '' : '?tv=2')
        if (img.getAttribute('src') === bust || img.getAttribute('src') === next) {
          if (img.complete && img.naturalWidth) onReady()
          else img.src = bust
          return
        }
        img.src = next.indexOf('http') === 0 ? next : bust
      }

      async function refresh() {
        const data = await loadCarta()
        if (!data) {
          show({
            schedule: 'weekday',
            price: 13,
            image: FALLBACK,
            name: 'Menú del día',
            fromApi: false,
          })
          return
        }
        show(pickMenu(data))
      }

      async function toggleFullscreen() {
        try {
          const el = document.documentElement
          if (!document.fullscreenElement) {
            await (el.requestFullscreen || el.webkitRequestFullscreen)?.call(el)
          } else {
            await (document.exitFullscreen || document.webkitExitFullscreen)?.call(document)
          }
        } catch (err) {
          console.warn('[menu-tv] fullscreen', err)
        }
        setTimeout(fitCartel, 100)
        setTimeout(fitCartel, 400)
      }

      $('tvFit')?.addEventListener('click', (e) => {
        e.preventDefault()
        fitCartel()
      })
      $('tvFullscreen')?.addEventListener('click', (e) => {
        e.preventDefault()
        toggleFullscreen()
      })
      window.addEventListener('resize', () => fitCartel())
      window.addEventListener('orientationchange', () => {
        setTimeout(fitCartel, 200)
        setTimeout(fitCartel, 600)
      })
      document.addEventListener('fullscreenchange', () => setTimeout(fitCartel, 100))
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') {
          fitCartel()
          refresh()
        }
      })

      refresh()
      setInterval(refresh, 5 * 60 * 1000)
      // Re-encajar por si el WebView de la TV cambia el viewport al cargar
      setInterval(fitCartel, 15000)
    })()
  </script>
</body>
</html>
