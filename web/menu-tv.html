<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Menú del día · TV · Casa Torino</title>
  <meta name="robots" content="noindex,nofollow" />
  <meta name="theme-color" content="#0c1018" />
  <meta name="description" content="Pantalla TV: cartel del menú del día completo, sin recortar." />
  <link rel="icon" type="image/jpeg" href="assets/logo.jpg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0c1018;
      --ink: #fff8e8;
      --muted: rgba(255, 248, 232, .7);
      --gold: #f1c40f;
      --red: #c8102e;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: Montserrat, system-ui, sans-serif;
      overflow: hidden;
    }
    /* Toda la pantalla = el cartel. Cabecera/pie van encima, no restan altura. */
    .tv {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100dvh;
      background:
        radial-gradient(ellipse at 50% 40%, rgba(241,196,15,.07), transparent 55%),
        var(--bg);
    }
    .tv-stage {
      position: absolute;
      inset: 0;
      display: block;
      overflow: hidden;
    }
    .tv-stage img {
      position: absolute;
      inset: 0;
      margin: auto;
      display: block;
      width: 100%;
      height: 100%;
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      object-position: center center;
      background: transparent;
    }
    .tv-stage img[hidden] { display: none !important; }
    .tv-empty {
      position: absolute;
      inset: 0;
      margin: auto;
      height: fit-content;
      max-width: 28rem;
      padding: 1.5rem;
      text-align: center;
      color: var(--muted);
      font-weight: 700;
      font-size: clamp(1rem, 2.2vw, 1.35rem);
      line-height: 1.45;
    }
    .tv-empty[hidden] { display: none !important; }
    .tv-chrome {
      position: absolute;
      left: 0;
      right: 0;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: .75rem 1rem;
      padding: .55rem 1rem;
      pointer-events: none;
      background: linear-gradient(180deg, rgba(12,16,24,.72), transparent);
    }
    .tv-chrome.is-bottom {
      top: auto;
      bottom: 0;
      background: linear-gradient(0deg, rgba(12,16,24,.78), transparent);
      pointer-events: none;
    }
    .tv-brand {
      display: flex;
      align-items: center;
      gap: .55rem;
      min-width: 0;
    }
    .tv-brand img {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--gold);
      flex: 0 0 auto;
    }
    .tv-brand strong {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: clamp(.95rem, 1.8vw, 1.25rem);
      font-weight: 700;
      text-shadow: 0 2px 10px rgba(0,0,0,.55);
    }
    .tv-brand strong em {
      font-style: italic;
      color: var(--gold);
    }
    .tv-meta { text-align: right; min-width: 0; }
    .tv-meta .label {
      display: block;
      font-size: .68rem;
      font-weight: 800;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: #ff6b81;
      text-shadow: 0 1px 6px rgba(0,0,0,.5);
    }
    .tv-meta .price {
      font-size: clamp(1.05rem, 2.2vw, 1.45rem);
      font-weight: 800;
      color: var(--gold);
      font-variant-numeric: tabular-nums;
      text-shadow: 0 2px 10px rgba(0,0,0,.55);
    }
    .tv-foot-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: .75rem;
      width: 100%;
      color: var(--muted);
      font-size: .74rem;
      font-weight: 600;
      text-shadow: 0 1px 6px rgba(0,0,0,.5);
    }
    .tv-foot-inner button {
      pointer-events: auto;
      border: 1px solid rgba(241,196,15,.4);
      background: rgba(12,16,24,.75);
      color: var(--gold);
      border-radius: 999px;
      padding: .42rem .9rem;
      font: inherit;
      font-weight: 800;
      font-size: .76rem;
      cursor: pointer;
    }
    .tv-foot-inner button:active { transform: scale(.98); }
    /* En TV: chrome más discreto para maximizar el cartel */
    @media (min-width: 1100px) and (min-height: 650px) {
      .tv-chrome { padding: .45rem 1.15rem; opacity: .92; }
      .tv-brand img { width: 40px; height: 40px; }
    }
    /* Pantalla completa: ocultar chrome salvo hover/focus cerca de bordes */
    :fullscreen .tv-chrome,
    :-webkit-full-screen .tv-chrome {
      opacity: 0;
      transition: opacity .25s ease;
    }
    :fullscreen .tv:hover .tv-chrome,
    :fullscreen .tv:focus-within .tv-chrome,
    :-webkit-full-screen .tv:hover .tv-chrome,
    :-webkit-full-screen .tv:focus-within .tv-chrome {
      opacity: 1;
    }
  </style>
</head>
<body>
  <div class="tv" id="tvRoot">
    <main class="tv-stage" id="tvStage" aria-live="polite">
      <img id="tvImg" alt="Menú del día" hidden />
      <p class="tv-empty" id="tvEmpty">Cargando menú del día…</p>
    </main>
    <header class="tv-chrome" aria-hidden="false">
      <div class="tv-brand">
        <img src="assets/logo.jpg" alt="" />
        <strong>Casa <em>Torino</em></strong>
      </div>
      <div class="tv-meta">
        <span class="label" id="tvLabel">Hoy · menú del día</span>
        <span class="price" id="tvPrice"></span>
      </div>
    </header>
    <footer class="tv-chrome is-bottom">
      <div class="tv-foot-inner">
        <span id="tvStatus">Cartel completo · toca pantalla completa</span>
        <button type="button" id="tvFullscreen" aria-label="Pantalla completa">Pantalla completa</button>
      </div>
    </footer>
  </div>

  <script src="carta.js"></script>
  <script>
    (() => {
      const FALLBACK = 'assets/menu-diario.jpg'
      const ORDER = [
        'menu-dia-unificado-semana',
        'menu-dia-co-finde',
        'menu-dia-es-finde',
        'menu-dia-sabado',
        'menu-dia-domingo',
      ]
      const $ = (id) => document.getElementById(id)
      const money = (n) =>
        Number(n).toLocaleString('es-ES', {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2,
        }) + '\u00a0€'

      async function loadCarta() {
        try {
          const r = await fetch('/api/carta', {
            cache: 'no-store',
            headers: { Accept: 'application/json' },
          })
          if (r.ok) return r.json()
        } catch (err) {
          console.warn('[menu-tv] api', err)
        }
        try {
          const r2 = await fetch('data/carta.json', { cache: 'no-store' })
          if (r2.ok) return r2.json()
        } catch (err) {
          console.warn('[menu-tv] json', err)
        }
        return null
      }

      function pickMenu(data) {
        const kindInfo =
          window.CasaTorinoCarta?.menuDayKind?.(data) || {
            schedule: 'weekday',
            kind: 'weekday',
          }
        const schedule = kindInfo.schedule || 'weekday'
        const md = data?.menuDay || {}
        const sat = md.saturday || {}
        const sun = md.sunday || {}
        const week = md.weekday || {}
        const satP = Number.isFinite(Number(sat.price)) ? Number(sat.price) : 16
        const sunP = Number.isFinite(Number(sun.price)) ? Number(sun.price) : 18
        const weekP = Number.isFinite(Number(week.price ?? week.unified))
          ? Number(week.price ?? week.unified)
          : 13
        const price =
          schedule === 'saturday' ? satP : schedule === 'sunday' ? sunP : weekP

        const menus = (data?.categories || []).find((c) => c && c.id === 'menus-dia')
        const itemSchedule = (it) =>
          window.CasaTorinoCarta?.menuItemSchedule?.(it) || ''
        let items = (menus?.items || []).filter(
          (it) =>
            it &&
            it.image_url &&
            !it.customProduct &&
            itemSchedule(it) === schedule,
        )
        items = [...items].sort((a, b) => {
          const ia = ORDER.indexOf(a.id)
          const ib = ORDER.indexOf(b.id)
          return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib)
        })
        const item = items[0] || null
        return {
          schedule,
          price,
          image: item?.image_url || FALLBACK,
          name: item?.name || 'Menú del día',
          fromApi: Boolean(item?.image_url),
        }
      }

      function show(pick) {
        const img = $('tvImg')
        const empty = $('tvEmpty')
        const price = $('tvPrice')
        const status = $('tvStatus')
        if (price) price.textContent = money(pick.price)
        if (!img) return
        const next = pick.image
        const apply = () => {
          img.hidden = false
          if (empty) empty.hidden = true
          if (status) {
            const t = new Date().toLocaleTimeString('es-ES', {
              hour: '2-digit',
              minute: '2-digit',
            })
            status.textContent = pick.fromApi
              ? `Cartel completo · actualizado ${t}`
              : `Cartel de respaldo · ${t}`
          }
        }
        if (img.getAttribute('src') === next && !img.hidden) {
          apply()
          return
        }
        img.onload = () => apply()
        img.onerror = () => {
          if (next !== FALLBACK) {
            img.src = FALLBACK
            return
          }
          img.hidden = true
          if (empty) {
            empty.hidden = false
            empty.textContent =
              'No hay foto del menú del día. Súbela en Editar carta (TPV).'
          }
        }
        img.alt = pick.name
        img.src = next
      }

      async function refresh() {
        const data = await loadCarta()
        if (!data) {
          show({
            schedule: 'weekday',
            price: 13,
            image: FALLBACK,
            name: 'Menú del día',
            fromApi: false,
          })
          return
        }
        show(pickMenu(data))
      }

      async function toggleFullscreen() {
        try {
          if (!document.fullscreenElement) {
            await document.documentElement.requestFullscreen?.()
          } else {
            await document.exitFullscreen?.()
          }
        } catch (err) {
          console.warn('[menu-tv] fullscreen', err)
        }
      }

      $('tvFullscreen')?.addEventListener('click', (e) => {
        e.stopPropagation()
        toggleFullscreen()
      })
      // Un toque en el cartel pide pantalla completa (mando / TV)
      $('tvStage')?.addEventListener('dblclick', () => toggleFullscreen())

      refresh()
      setInterval(refresh, 3 * 60 * 1000)
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') refresh()
      })
    })()
  </script>
</body>
</html>
