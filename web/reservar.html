<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Reservar mesa · Casa Torino</title>
  <meta name="description" content="Reserva mesa online en Casa Torino, Gijón." />
  <meta name="theme-color" content="#fff8e8" />
  <link rel="icon" type="image/jpeg" href="assets/logo.jpg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    .reserve-page { max-width: 480px; margin: 0 auto; padding: 1.5rem 1rem 3rem; }
    .reserve-page h1 { font-family: 'Playfair Display', Georgia, serif; font-size: 1.85rem; margin: .5rem 0 .35rem; }
    .reserve-page .lead { color: var(--muted); margin-bottom: 1.25rem; }
    .reserve-page label { display: block; font-size: .72rem; font-weight: 800; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: .75rem 0 .35rem; }
    .reserve-page input, .reserve-page select, .reserve-page textarea {
      width: 100%; min-height: 48px; border-radius: 14px; border: 1px solid var(--line);
      background: var(--card); padding: .65rem 1rem; font: inherit; font-weight: 600;
      color: var(--ink); color-scheme: light;
    }
    .reserve-page input[type="time"] {
      min-height: 52px;
      font-size: 1.05rem;
      font-weight: 700;
    }
    .reserve-page textarea { min-height: 90px; resize: vertical; }
    .reserve-page .actions { display: grid; gap: .65rem; margin-top: 1.25rem; }
    .reserve-page .msg { margin-top: 1rem; padding: .85rem 1rem; border-radius: 14px; font-weight: 650; font-size: .92rem; }
    .reserve-page .msg.ok { background: rgba(16,185,129,.12); color: #047857; }
    .reserve-page .msg.err { background: rgba(220,38,38,.1); color: var(--red); }
    .reserve-page .cap { font-size: .82rem; color: var(--muted); font-weight: 600; margin-top: .35rem; }
    .top-back { display: inline-flex; gap: .4rem; align-items: center; color: var(--muted); text-decoration: none; font-weight: 700; font-size: .9rem; margin-bottom: .75rem; }
    .top-back:hover { color: var(--gold-2); }
  </style>
</head>
<body>
  <main class="reserve-page">
    <a class="top-back" href="index.html"><i class="fa-solid fa-arrow-left"></i> Volver</a>
    <img src="assets/logo.jpg" alt="Casa Torino" width="72" height="72" style="border-radius:50%;border:2px solid var(--gold);object-fit:cover" />
    <h1>Reservar mesa</h1>
    <p class="lead">Deja tu reserva online. Parking 24&nbsp;h · siempre tamales, lechona y bandeja paisa. También por WhatsApp.</p>

    <form id="form" novalidate>
      <label for="nombre">Nombre</label>
      <input id="nombre" name="nombre" required autocomplete="name" maxlength="80" />

      <label for="telefono">Teléfono</label>
      <input id="telefono" name="telefono" type="tel" required autocomplete="tel" maxlength="20" />

      <label for="fecha">Fecha</label>
      <input id="fecha" name="fecha" type="date" required />

      <label for="hora">Hora</label>
      <input id="hora" name="hora" type="time" required step="300" />
      <p class="cap" id="capHint">Comida 12:00–15:30 · Cena 19:00–22:30. Elige en el reloj o escribe la hora.</p>

      <label for="personas">Personas</label>
      <input id="personas" name="personas" type="number" min="1" max="20" value="2" required />

      <label for="notas">Notas (opcional)</label>
      <textarea id="notas" name="notas" maxlength="300" placeholder="Alergias, celebración…"></textarea>

      <div class="actions">
        <button class="btn btn-gold" type="submit"><i class="fa-solid fa-calendar-check"></i> Confirmar reserva</button>
        <a class="btn btn-outline" href="https://wa.me/34746082265?text=Hola%2C%20quiero%20reservar%20mesa%20en%20Casa%20Torino" target="_blank" rel="noopener"><i class="fa-brands fa-whatsapp"></i> WhatsApp</a>
      </div>
    </form>
    <div id="msg" class="msg" hidden></div>
  </main>

  <script>
    (() => {
      const API = 'https://reservas-casatorino.vercel.app/api/reservas'
      const CAP_API = 'https://reservas-casatorino.vercel.app/api/reservas-capacity'
      const horaInput = document.getElementById('hora')
      const fecha = document.getElementById('fecha')
      const CAP_FALLBACK =
        'Comida 12:00–15:30 · Cena 19:00–22:30. Elige en el reloj o escribe la hora.'

      function madridParts(d = new Date()) {
        const parts = Object.fromEntries(
          new Intl.DateTimeFormat('en-CA', {
            timeZone: 'Europe/Madrid',
            year: 'numeric',
            month: '2-digit',
            day: '2-digit',
            hour: '2-digit',
            minute: '2-digit',
            hour12: false,
          })
            .formatToParts(d)
            .filter((p) => p.type !== 'literal')
            .map((p) => [p.type, p.value]),
        )
        return {
          day: `${parts.year}-${parts.month}-${parts.day}`,
          hm: `${parts.hour}:${parts.minute}`,
          minutes: Number(parts.hour) * 60 + Number(parts.minute),
        }
      }

      function normalizeHora(raw) {
        let h = String(raw || '').trim()
        if (/^\d{1,2}$/.test(h)) h = `${h.padStart(2, '0')}:00`
        if (/^\d{1,2}:\d{2}:\d{2}$/.test(h)) h = h.slice(0, 5)
        if (!/^\d{2}:\d{2}$/.test(h)) return ''
        const [hh, mm] = h.split(':').map(Number)
        if (hh > 23 || mm > 59) return ''
        return h
      }

      function minutesOf(hm) {
        const [hh, mm] = String(hm).split(':').map(Number)
        return hh * 60 + mm
      }

      /** Servicio real: comida + cena (sin hueco de la tarde en el selector). */
      function isServicioHora(hm) {
        const m = minutesOf(hm)
        const comida = m >= minutesOf('12:00') && m <= minutesOf('15:30')
        const cena = m >= minutesOf('19:00') && m <= minutesOf('22:30')
        return comida || cena
      }

      function defaultHora() {
        const { minutes } = madridParts()
        if (minutes < minutesOf('15:30')) return '14:00'
        if (minutes < minutesOf('19:00')) return '19:30'
        if (minutes < minutesOf('22:30')) {
          const rounded = Math.ceil(minutes / 5) * 5
          const hh = String(Math.floor(rounded / 60) % 24).padStart(2, '0')
          const mm = String(rounded % 60).padStart(2, '0')
          const cand = `${hh}:${mm}`
          return isServicioHora(cand) ? cand : '20:00'
        }
        return '14:00'
      }

      const today = madridParts()
      fecha.min = today.day
      fecha.value = today.day
      horaInput.value = defaultHora()

      async function refreshCap() {
        const hint = document.getElementById('capHint')
        const hora = normalizeHora(horaInput.value)
        if (!hora || !isServicioHora(hora)) {
          hint.textContent = CAP_FALLBACK
          return
        }
        try {
          const u = new URL(CAP_API)
          u.searchParams.set('fecha', fecha.value)
          u.searchParams.set('hora', hora)
          const r = await fetch(u.toString(), { cache: 'no-store' })
          if (!r.ok) return
          const d = await r.json()
          hint.textContent = `Plazas libres a las ${hora}: ${d.remaining} de ${d.capacity} (ocupadas ${d.used})`
        } catch {
          hint.textContent = CAP_FALLBACK
        }
      }
      fecha.addEventListener('change', refreshCap)
      horaInput.addEventListener('change', refreshCap)
      horaInput.addEventListener('input', refreshCap)
      refreshCap()

      document.getElementById('form').addEventListener('submit', async (e) => {
        e.preventDefault()
        const msg = document.getElementById('msg')
        msg.hidden = true
        const hora = normalizeHora(horaInput.value)
        const payload = {
          nombre: document.getElementById('nombre').value.trim(),
          telefono: document.getElementById('telefono').value.trim(),
          fecha: fecha.value,
          hora,
          personas: Number(document.getElementById('personas').value) || 2,
          notas: document.getElementById('notas').value.trim(),
          creadoPor: 'web',
        }
        if (!payload.nombre || !payload.telefono) {
          msg.className = 'msg err'
          msg.textContent = 'Nombre y teléfono son obligatorios.'
          msg.hidden = false
          return
        }
        if (!hora) {
          msg.className = 'msg err'
          msg.textContent = 'Pon una hora válida (ej. 14:00 o 20:15).'
          msg.hidden = false
          horaInput.focus()
          return
        }
        if (!isServicioHora(hora)) {
          msg.className = 'msg err'
          msg.textContent =
            'Horario de reservas: comida 12:00–15:30 o cena 19:00–22:30.'
          msg.hidden = false
          horaInput.focus()
          return
        }
        try {
          const r = await fetch(API, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),
          })
          const data = await r.json().catch(() => ({}))
          if (!r.ok) throw new Error(data.error || 'No se pudo reservar')
          msg.className = 'msg ok'
          msg.textContent = `Reserva confirmada · código ${data.codigo}. Te esperamos.`
          msg.hidden = false
          e.target.reset()
          fecha.value = madridParts().day
          horaInput.value = defaultHora()
          refreshCap()
        } catch (err) {
          msg.className = 'msg err'
          msg.textContent = err.message || 'Error al reservar'
          msg.hidden = false
        }
      })
    })()
  </script>
</body>
</html>
