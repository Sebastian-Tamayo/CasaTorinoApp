# Fuerza deploy al alias de producción casa-torino-web.vercel.app
# (el Git integration a veces marca success sin actualizar el alias).
#
# Secreto requerido en el repo:
#   VERCEL_TOKEN — https://vercel.com/account/tokens (scope sebas3212)
name: Deploy casa-torino-web

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/deploy-casa-torino-web.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy web/ to Vercel production
        working-directory: web
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_JNQ3Bn97PBn7QHSYkTZw7wXy
          VERCEL_PROJECT_ID: prj_YrLr62ys2WkZzYKrjix0NK4WmtES
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::Falta secrets.VERCEL_TOKEN"
            exit 1
          fi
          mkdir -p .vercel
          printf '%s\n' "{\"projectId\":\"$VERCEL_PROJECT_ID\",\"orgId\":\"$VERCEL_ORG_ID\",\"projectName\":\"casa-torino-web\"}" > .vercel/project.json
          npx vercel@39 deploy --prod --yes --token "$VERCEL_TOKEN" --scope sebas3212
