# Fuerza deploy al alias casa-torino-web.vercel.app
# El proyecto Vercel tiene Root Directory = "web" → el CLI debe correr en la raíz del monorepo.
#
# Secreto: VERCEL_TOKEN (Full Account / Deploy en team sebas3212)
name: Deploy casa-torino-web

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/deploy-casa-torino-web.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Vercel production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_JNQ3Bn97PBn7QHSYkTZw7wXy
          VERCEL_PROJECT_ID: prj_YrLr62ys2WkZzYKrjix0NK4WmtES
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::Falta secrets.VERCEL_TOKEN"
            exit 1
          fi
          mkdir -p .vercel
          printf '%s\n' "{\"projectId\":\"$VERCEL_PROJECT_ID\",\"orgId\":\"$VERCEL_ORG_ID\",\"projectName\":\"casa-torino-web\"}" > .vercel/project.json
          npx vercel@latest deploy --prod --yes --scope sebas3212 --token "$VERCEL_TOKEN"
