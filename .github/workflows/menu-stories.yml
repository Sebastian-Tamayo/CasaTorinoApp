# Historias Instagram + TikTok del menú del día.
# Lo dispara el PC del local (o el TPV) con repository_dispatch.
# Tiene que estar en la rama por defecto (main) para que GitHub acepte el evento.
# No despliega Vercel.

name: Menu stories

on:
  repository_dispatch:
    types: [menu-story]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Puppeteer (solo el render; WhatsApp no corre aquí)
        run: npm install --prefix /tmp/storydeps puppeteer@23.11.1

      - name: Publicar Instagram y TikTok
        working-directory: scripts
        env:
          NODE_PATH: /tmp/storydeps/node_modules
          MENU_STORY_JSON: ${{ toJson(github.event.client_payload) }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
          TIKTOK_PRIVACY: ${{ secrets.TIKTOK_PRIVACY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node publish-stories.js
